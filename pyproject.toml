[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kona-local-hop"
dynamic = ["version"]
description = "Offline security inspection and verifiable evidence for AI-assisted repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ruiming Zhao" }]
keywords = ["ai", "agent", "security", "scanner", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
kona = "kona.cli:main"

[tool.setuptools.packages.find]
include = ["kona*"]

[tool.setuptools.dynamic]
version = {attr = "kona.__version__"}
