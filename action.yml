name: Kona Agent Gate
description: Run a local AI Agent acceptance contract and publish portable evidence.
author: uuzzrm
branding:
  icon: shield
  color: purple
inputs:
  contract:
    description: Repository-relative path to a Kona contract JSON file.
    required: true
  artifact-name:
    description: Name of the uploaded evidence artifact.
    required: false
    default: kona-evidence
  retention-days:
    description: Artifact retention period accepted by actions/upload-artifact.
    required: false
    default: "14"
  python-version:
    description: Python version used to run Kona.
    required: false
    default: "3.12"
outputs:
  outcome:
    description: passed, rejected, or error.
    value: ${{ steps.gate.outputs.outcome }}
  accepted:
    description: true only when the contract and portable bundle verification pass.
    value: ${{ steps.gate.outputs.accepted }}
  bundle:
    description: Absolute path to the generated portable evidence bundle.
    value: ${{ steps.gate.outputs.bundle }}
  run-id:
    description: Kona run identifier.
    value: ${{ steps.gate.outputs.run-id }}
  diagnostic:
    description: Run directory uploaded when a complete bundle is unavailable.
    value: ${{ steps.gate.outputs.diagnostic }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Kona
      shell: bash
      env:
        KONA_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$KONA_ACTION_PATH"
    - name: Run Kona gate
      id: gate
      shell: bash
      env:
        KONA_CONTRACT: ${{ inputs.contract }}
        KONA_WORKSPACE: ${{ github.workspace }}
        KONA_RUNS: ${{ runner.temp }}/kona-runs
        KONA_BUNDLE: ${{ runner.temp }}/kona-evidence.kona.zip
      run: python -m kona.github --contract "$KONA_WORKSPACE/$KONA_CONTRACT" --output-root "$KONA_RUNS" --bundle "$KONA_BUNDLE"
    - name: Upload portable evidence
      if: ${{ steps.gate.outputs.bundle != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.gate.outputs.bundle }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
    - name: Upload diagnostic evidence
      if: ${{ always() && steps.gate.outputs.bundle == '' && steps.gate.outputs.diagnostic != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}-diagnostic
        path: ${{ steps.gate.outputs.diagnostic }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
    - name: Enforce Kona gate
      shell: bash
      env:
        KONA_EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
      run: exit "$KONA_EXIT_CODE"
