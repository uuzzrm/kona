name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: python -m compileall -q kona tests scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run contract example
        run: |
          python scripts/run_contract_examples.py
      - name: Validate skill metadata
        run: python scripts/validate_skill_metadata.py skills/kona-capture
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Build source distribution
        run: |
          python -m pip download --no-deps --no-binary=:all: --dest dist .
      - name: Verify installed wheel
        run: python scripts/verify_distribution.py
