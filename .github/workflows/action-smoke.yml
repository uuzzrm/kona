name: Action smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Kona Agent Gate
        id: kona
        uses: ./
        with:
          contract: examples/contracts/action-smoke.json
          artifact-name: kona-action-smoke-${{ matrix.os }}
          retention-days: "1"
      - name: Check Action outputs
        shell: bash
        run: |
          test "${{ steps.kona.outputs.outcome }}" = "passed"
          test "${{ steps.kona.outputs.accepted }}" = "true"
          test -n "${{ steps.kona.outputs.bundle }}"
          test -n "${{ steps.kona.outputs.run-id }}"
  rejected-action:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run intentionally rejected Kona gate
        id: kona
        continue-on-error: true
        uses: ./
        with:
          contract: examples/contracts/action-smoke-rejected.json
          artifact-name: kona-rejected-${{ matrix.os }}
          retention-days: "1"
      - name: Require rejection outputs
        shell: bash
        run: |
          test "${{ steps.kona.outcome }}" = "failure"
          test "${{ steps.kona.outputs.outcome }}" = "rejected"
          test "${{ steps.kona.outputs.accepted }}" = "false"
      - name: Download rejected evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kona-rejected-${{ matrix.os }}
          path: ${{ runner.temp }}/downloaded-kona
      - name: Verify rejected bundle remains valid
        shell: bash
        run: |
          set +e
          python -m kona bundle verify "${{ runner.temp }}/downloaded-kona/kona-evidence.kona.zip" --json
          code=$?
          test "$code" = "1"

  scan-action:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run clean Kona Guard scan Action
        id: clean
        uses: ./scan
        with:
          path: .
          sarif-path: .kona/clean-findings.sarif
          artifact-name: kona-scan-clean-${{ matrix.os }}
          retention-days: "1"
      - name: Check clean scan outputs
        shell: bash
        run: |
          test "${{ steps.clean.outputs.exit-code }}" = "0"
          test "${{ steps.clean.outputs.findings }}" = "0"
          test -n "${{ steps.clean.outputs.sarif }}"
      - name: Create finding fixture
        shell: bash
        run: |
          mkdir -p scan-fixture
          python -c "from pathlib import Path; Path('scan-fixture/settings.py').write_text('TOKEN = ' + repr('ghp_' + 'A' * 36) + '\\n', encoding='utf-8')"
      - name: Create root scan baseline
        shell: bash
        run: |
          set +e
          python -m kona scan . --format json --write-baseline .kona/root-baseline.json --fail-on high > "$RUNNER_TEMP/kona-baseline-scan.json"
          code=$?
          test "$code" = "1"
      - name: Run root baseline scan Action
        id: baseline
        uses: ./scan
        with:
          path: .
          baseline: .kona/root-baseline.json
          sarif-path: .kona/root-baselined.sarif
          artifact-name: kona-scan-baseline-${{ matrix.os }}
          retention-days: "1"
      - name: Check root baseline outputs
        shell: bash
        run: |
          test "${{ steps.baseline.outputs.exit-code }}" = "0"
          test "${{ steps.baseline.outputs.findings }}" = "0"
          test "${{ steps.baseline.outputs.baseline-suppressed }}" = "1"
          test -n "${{ steps.baseline.outputs.sarif }}"
      - name: Run intentionally failing scan Action
        id: finding
        continue-on-error: true
        uses: ./scan
        with:
          path: scan-fixture
          fail-on: high
          sarif-path: .kona/finding.sarif
          artifact-name: kona-scan-finding-${{ matrix.os }}
          retention-days: "1"
      - name: Check finding scan outputs
        shell: bash
        run: |
          test "${{ steps.finding.outcome }}" = "failure"
          test "${{ steps.finding.outputs.exit-code }}" = "1"
          test "${{ steps.finding.outputs.findings }}" = "1"
