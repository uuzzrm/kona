name: Released Action smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-action:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run published Kona major tag
        id: kona
        uses: uuzzrm/kona@0b882e8595dc9ae02f7e990c1baf1ae42980e32b # v0.10.0
        with:
          contract: examples/contracts/action-smoke.json
          artifact-name: kona-v0-smoke-${{ matrix.os }}
          retention-days: "1"
      - name: Require published Action outputs
        shell: bash
        run: |
          test "${{ steps.kona.outputs.outcome }}" = "passed"
          test "${{ steps.kona.outputs.accepted }}" = "true"
